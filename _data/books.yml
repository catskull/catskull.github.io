- title: Excellent Advice for Living
  author: Kevin Kelly
  published: 2023
  wiki: https://en.wikipedia.org/wiki/Kevin_Kelly_(editor)
  date: 2025-11-20
  text: >-
    This is a collection of idioms and ideas. It's not a hard read and should potentially be read over a long time rather than in one sitting because a lot of the ideas need a bit of time to sink in. Maybe I'll come up with something.

- title: Hatchet
  author: Gary Paulsen
  published: 1987
  wiki: https://en.wikipedia.org/wiki/Hatchet_(novel)
  date: 2026-07-20
  text: >-
    As a recipient of the Newbery Honor, _Hatchet_ is (was?) a book very common in the curriculum of my elementary school education. I think I read it in 4th grade for the first time and have always enjoyed it. A few years ago I read it again and found it just as engaging. Finally, over the summer I read it to my children and they loved it as well. There's a subplot about an affair that I mostly skipped over and that never really comes up in any of the sequels.

- title: Brian's Winter
  author: Gary Paulsen
  published: 1996
  wiki: https://en.wikipedia.org/wiki/Brian's_Winter
  date: 2026-07-30
  text: >-
    A direct sequel to _Hatchet_, _Brian's Winter_ is an alternate ending to that book where he isn't simply saved by a _deus ex machina_ and instead has to survive the winter in the wilderness. I honestly think this is the best book in the series. The protagonist Brian by this point has learned how to survive and really does well for himself, and it is fun to read about his adventure.

- title: Brian's Return
  author: Gary Paulsen
  published: 1999
  wiki: https://en.wikipedia.org/wiki/Brian's_Return
  date: 2026-08-10
  text: >-
    Another sequel. This time Brian is back in civilization and yearns for the wild. He plans and carries out his return. Potentially a bit more philosophical and anticlimactic, but still fun if you're invested in the _Brian_ saga. My kids liked it.

- title: Brian's Hunt
  author: Gary Paulsen
  published: 2003
  wiki: https://en.wikipedia.org/wiki/Brian's_Hunt
  date: 2026-08-20
  text: >-
    Another sequel. Brian is still in the wilderness. He finds a family mauled to death by a bear and hunts it down. Probably the weakest of the saga, other than the original sequel.

- title: The River
  author: Gary Paulsen
  published: 1991
  wiki: https://en.wikipedia.org/wiki/The_River_(novel)
  date: 2026-08-30
  text: >-
    This is the original sequel, which takes place in the same timeline as the ending of the first book, where he is rescued before winter. Some university researchers convince him and his mom to go back so they can "learn" about survival, and disaster strikes. Very much the weakest of all the books and probably only worth reading if you, like my 5-year-old, love the _Brian_ saga and can't get enough.

- title: Steve Jobs
  author: Walter Isaacson
  published: 2011
  wiki: https://en.wikipedia.org/wiki/Steve_Jobs_(book)
  date: 2026-09-20
  text: >-
    I guess I'll go on record as being an unapologetic Steve Jobs fan. That is, the Steve Jobs I know, which is very likely not at all the person who Steve Jobs was. I loved this book. How did a kid go on to create one of the most defining companies of the 20th century? I don't have the answers, but this biography has at least some insight. I hope someday to create something truly great. However, in the book Isaacson asks Jobs why he wanted a biography and, to paraphrase, Jobs replied, "So my children will know me." I feel pretty confident that if I died today, my kids could say they knew me. Maybe that's great enough.

- title: Ender's Game
  author: Orson Scott Card
  published: 1985
  wiki: https://en.wikipedia.org/wiki/Ender%27s_Game
  date: 2026-11-20
  text: >-
    I picked up this book in the 8th or 9th grade and it was the first (and honestly one of the few) books I truly could not put down until I finished it. If I remember right, I read the majority of it in a single weekend. After finishing the _Hatchet_ series, we bounced around trying to find another book my kids were interested in. Quite a few misses. So finally I decided to throw this at them. I definitely had to edit it a bit for content, but they kept asking for more. Finally, about halfway through, it hooked me and I stayed up way too late ripping through it. I didn't tell my kids I skipped over half the book, and they didn't notice. I think I enjoyed this for the same reason I enjoyed _Hatchet_. It's just fun to read about someone impossibly skilled deal with impossible challenges and succeed.
    
    
