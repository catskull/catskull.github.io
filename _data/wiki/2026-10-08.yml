  title: |
    Sitar in Western popular music
  image_url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/90/Dia5275_Ravi_Shankar.jpg/330px-Dia5275_Ravi_Shankar.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail
