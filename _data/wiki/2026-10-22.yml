  title: |
    History of the United States (1945–1964)
  image_url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c1/March_on_Washington_for_Jobs_and_Freedom%2C_Martin_Luther_King%2C_Jr._and_Joachim_Prinz_1963.jpg/330px-March_on_Washington_for_Jobs_and_Freedom%2C_Martin_Luther_King%2C_Jr._and_Joachim_Prinz_1963.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail
  image_wh: 330x230
  description: |
    
  extract: |
    The history of the United States from 1945 to 1964 was a time of high economic growth and general prosperity. It was also a time of confrontation as the capitalist United States and its allies politically opposed the Soviet Union and other communist states; the Cold War had begun. African Americans united and organized, and a triumph of the civil rights movement ended Jim Crow segregation in the Southern United States. Further laws were passed that made discrimination illegal and provided federal oversight to guarantee voting rights.
- url: https://en.wikipedia.org/wiki/Cursed_image
  created: '2026-10-22T20:59:05Z'
  title: |
    Cursed image
  image_url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6f/Mychtar_and_his_Snowdog.jpg/330px-Mychtar_and_his_Snowdog.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail
  image_wh: 330x261
  description: |
    Images perceived as mysterious or disturbing
  extract: |
    
    A cursed image refers to a picture that is perceived as mysterious or disturbing due to its content, poor quality, or a combination of the two. A cursed image is intended to make a person question the reason for the image's existence in the first place. The term was coined on social media in 2015 and popularised the following year.
