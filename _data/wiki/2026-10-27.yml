  extract: |
    A segment display is a display device comprising several segments, which switch on and off to give the appearance of digits or alphanumeric characters. The segments are usually single LEDs or liquid crystals. Segment displays are often used in digital watches and pocket calculators. Common types include seven-segment displays and alphanumeric fourteen-segment displays and sixteen-segment displays.
