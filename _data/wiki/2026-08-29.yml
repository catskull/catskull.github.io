  description: |
    Solid rock under loose surface material
  extract: |
    In geology, bedrock is the solid rock that lies under weathered rock and unconsolidated or loose superficial deposits in the near surface part of Earth's crust or the crust of another terrestrial planet. The top of the bedrock is known as rockhead.
