    Prosopagnosia, also known as face blindness, is a cognitive disorder of face perception in which the ability to recognize familiar faces, including one's own face (self-recognition), is impaired, while other aspects of visual processing and intellectual functioning remain intact. The term originally referred to a condition following acute brain damage, but a congenital or developmental form of the disorder also exists, with a prevalence of 2–2.5%.
