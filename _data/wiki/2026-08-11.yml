    Starship Troopers  is a Japanese six-part anime OVA produced by Sunrise and Bandai, and released in 1988. It is based on the 1959 book Starship Troopers by Robert A. Heinlein. The OVA was dedicated to Heinlein, who died before the first part of the series was released.
