    The Boyhood of Raleigh
  image_url: https://upload.wikimedia.org/wikipedia/commons/thumb/f/f0/John_Everett_Millais_%281829-1896%29_-_The_Boyhood_of_Raleigh_-_N01691_-_National_Gallery.jpg/330px-John_Everett_Millais_%281829-1896%29_-_The_Boyhood_of_Raleigh_-_N01691_-_National_Gallery.jpg
